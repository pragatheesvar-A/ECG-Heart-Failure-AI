[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deephhf-inspired"
version = "0.1.0"
description = "Experimental research prototype for long-recording ECG heart-failure risk modelling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "PyYAML>=6.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "torch>=2.1", "streamlit>=1.37"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
deephhf = "deephhf.cli:main"

[tool.setuptools.packages.find]
include = ["deephhf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
